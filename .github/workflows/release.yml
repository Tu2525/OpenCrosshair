# Push a tag like v0.2.0 and this builds the exe and publishes a GitHub release.
# Installed copies pick the release up on their next update check.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # The app compares its own version to the release tag. If they disagreed, every
      # install would "update" to the same build forever, so refuse to publish.
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag is $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --release
      - run: cargo build --release

      # Optional SignPath code signing. These steps are skipped unless the
      # SIGNPATH_API_TOKEN secret exists; without it the unsigned exe is published.
      - name: Upload exe for signing
        id: upload-unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          path: target/release/OpenCrosshair.exe

      - name: Submit SignPath signing request
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'OpenCrosshair'
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: 'signed'

      - name: Replace exe with signed exe
        if: env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: cp signed/OpenCrosshair.exe target/release/OpenCrosshair.exe

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/OpenCrosshair.exe OpenCrosshair.exe
          cp target/release/OpenCrosshair.exe OpenCrosshair-Setup.exe
          gh release create "$GITHUB_REF_NAME" OpenCrosshair-Setup.exe OpenCrosshair.exe \
            --title "OpenCrosshair $GITHUB_REF_NAME" --generate-notes
